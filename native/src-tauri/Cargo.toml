[package]
name = "golos-native"
version = "0.1.0"
description = "Private, local audio transcription"
edition = "2021"

[lib]
name = "golos_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` provides the range-capable `asset:` protocol used to stream
# a recording's normalized WAV into the webview. It is enabled unconditionally
# (not behind a package feature) so local playback also works in `tauri dev`.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
sha2 = "0.10"
ureq = "2.12"
# Loopback-only local AI requests; no TLS/provider SDK or automatic proxy support.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "macros"] }
fs2 = "0.4"
bzip2 = "0.4"
tar = "0.4"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
cpal = "0.15.3"
whisper-rs = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "aiff", "isomp4", "ogg", "wav"] }
rubato = { version = "0.16.2", default-features = false }
# Pure-Rust Opus decoder (RFC 6716/8251, no FFI and no bundled C library, so
# nothing has to be installed or executed at runtime). Symphonia demuxes
# Ogg/Opus but ships no Opus decoder; this supplies one.
rusty-opus = "1"
# Offline speaker diarization (a pyannote segmentation model plus a speaker
# embedding model). The `static` feature downloads prebuilt sherpa-onnx and ONNX
# Runtime libraries at build time; diarization afterwards runs fully offline.
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
