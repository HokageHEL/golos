[package]
name = "golos-native"
version = "0.1.0"
description = "Private, local audio transcription"
edition = "2021"

[lib]
name = "golos_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
whisper-rs = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "alac", "flac", "mp3", "pcm", "vorbis", "aiff", "isomp4", "ogg", "wav"] }
rubato = { version = "0.16.2", default-features = false }
# Pure-Rust Opus decoder (RFC 6716/8251, no FFI and no bundled C library, so
# nothing has to be installed or executed at runtime). Symphonia demuxes
# Ogg/Opus but ships no Opus decoder; this supplies one.
rusty-opus = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
