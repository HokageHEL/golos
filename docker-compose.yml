# Local stand-ins for the two managed services the app uses in production.
# Supabase is not here — it has its own CLI (`npx supabase start`).
#
#   docker compose up -d
#
# Upstash is an HTTP-fronted Redis, and @upstash/redis speaks only that REST
# dialect — a plain `redis://` server is not a drop-in. serverless-redis-http
# is the shim Upstash themselves point at for local development.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      # Must match UPSTASH_REDIS_REST_URL in .env.local.
      - '127.0.0.1:8079:80'
    environment:
      SRH_MODE: env
      # Must match UPSTASH_REDIS_REST_TOKEN in .env.local.
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379

volumes:
  redis-data:
