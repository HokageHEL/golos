name: CI

# Least-privilege validation for the offline desktop app. No cloud credentials are configured, and no Whisper model is
# downloaded or run: the real-inference Rust test stays `#[ignore]`d, so only
# public fixtures and the default (offline) test suite execute here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  checks:
    name: Lint, tests, typecheck, Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        # WebKitGTK 4.1, AppIndicator and libclang cover Tauri plus whisper.cpp's
        # bindgen/CMake build. Debian names follow the official Tauri prerequisites.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libclang-dev \
            libasound2-dev \
            build-essential \
            cmake \
            patchelf \
            pkg-config \
            file

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target

      - name: Refresh sherpa-onnx native link metadata
        # sherpa-onnx-sys extracts libraries under target/sherpa-onnx-prebuilt,
        # outside Cargo's tracked build outputs. rust-cache can restore its
        # fingerprint/link-search metadata without that directory. Force only
        # this package's build script to rerun and restore its native archives.
        # The cache cleanup leaves empty lib/ directories; upstream treats the
        # directory's presence as a complete install, so remove that cache too.
        run: |
          node -e "require('node:fs').rmSync('native/src-tauri/target/sherpa-onnx-prebuilt', { recursive: true, force: true })"
          cargo clean --manifest-path native/src-tauri/Cargo.toml -p sherpa-onnx-sys

      - name: Verify native prerequisites
        run: node scripts/check-native-prerequisites.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Typecheck (native frontend)
        run: npm run native:check

      - name: Build native frontend
        # tauri-build embeds `frontendDist`, so this must run before cargo.
        run: npm run native:build

      - name: Browser usability checks (mocked native IPC)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Rust formatting
        run: cargo fmt --manifest-path native/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path native/src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests (offline; real-inference test stays ignored)
        run: cargo test --locked --manifest-path native/src-tauri/Cargo.toml
